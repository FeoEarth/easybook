name: Refresh Agent phase 2/3 generated assets
on:
  push:
    branches: [feat/agent-sandbox-phase2-phase3-20261122]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - name: Commit exact generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/editor.js app/src/main/assets/editor.js.LEGAL.txt worker/editor.mjs worker/ui.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(agent): refresh generated bundles for VM tool protocol"
            git push origin HEAD:feat/agent-sandbox-phase2-phase3-20261122
          fi
