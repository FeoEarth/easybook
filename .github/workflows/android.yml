name: Build Android APK
on:
  push:
    branches: [main, easybook-native-data]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    if: github.event_name != 'pull_request' || (github.head_ref == 'feat/unified-workspace-identity' || github.head_ref == 'feat/easybook-passkeys' || github.head_ref == 'feat/easybook-accounts-oauth' || github.head_ref == 'fix/android-sync-policy-save' || github.head_ref == 'fix/sync-policies-active-space' || github.head_ref == 'fix/sync-policies-list-gestures' || github.head_ref == 'fix/sync-policies-list-hit-area' || github.head_ref == 'fix/sync-policies-large-attachments' || github.head_ref == 'fix/sync-policies-pdf-reader' || github.head_ref == 'fix/sync-policies-pdf-loading' || github.head_ref == 'fix/sync-policies-pdf-interaction' || github.head_ref == 'fix/sync-policies-tables-pickers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.easybook-signing/development.keystore
          key: easybook-notes-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.easybook-signing"
          if [ ! -f "$HOME/.easybook-signing/development.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Easybook,C=SG" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused folder navigation regression
        run: node scripts/folder-navigation-test.mjs
      - name: Attachment protocol static checks
        run: node --check shared/attachments.mjs && node --check worker/attachments.mjs && node --check app/src/main/assets/pdf/reader.mjs && node --check app/src/main/assets/pdf/glass.mjs
      - name: Build editor and focused table integrity
        run: npm run build:editor && node scripts/table-integrity.mjs && node scripts/picker-static-check.mjs
      - name: Android and Web table contract consistency
        run: gradle :app:testReleaseUnitTest --tests com.feoearth.easybook.TableContractTest --tests com.feoearth.easybook.NativeMcpPairingTest --no-daemon
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signing
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Verify Passkey signing association
        run: node scripts/check-android-identity.mjs app/build/outputs/apk/release/app-release.apk
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Easybook-0.8.0.apk
          sha256sum Easybook-0.8.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-0.8.0.apk
            SHA256SUMS.txt
  release:
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Easybook-APK
      - name: Publish user-authorized APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.8.0-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Easybook-0.8.0.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easybook 0.8.0 · build ${GITHUB_RUN_NUMBER}" --notes "账户与权限重构的阶段性发布，沿用现有签名。保留当前账户登录、同步、编辑器、表格、附件及 QWEA0。新工作区、OAuth、账户删除与恢复保护代码已纳入，待客户端接入和生产迁移完成后统一启用。当前请使用浏览器账户入口；原生通行密钥随后续服务启用。此 APK 不代表全部重构功能已经开放。"


