name: Build Android APK
on:
  push:
    branches: [main, easybook-native-data]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.easybook-signing/development.keystore
          key: easybook-notes-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.easybook-signing"
          if [ ! -f "$HOME/.easybook-signing/development.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Easybook,C=SG" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signing
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Easybook-0.8.0.apk
          sha256sum Easybook-0.8.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-0.8.0.apk
            SHA256SUMS.txt
      - name: Publish APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.8.0-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Easybook-0.8.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "Easybook 0.8.0 · build ${GITHUB_RUN_NUMBER}" --notes "第五阶段笔记管理：长按与滑动快捷操作、置顶、多选批量移动和删除、最近删除恢复及永久删除、文件夹管理、笔记内查找；包含新版格式菜单。关键交互与同步删除状态测试通过，APK 签名验证通过；Android 真机体验尚未验证。"
      - name: Keep latest APK available through repository downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/apk-download" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/apk-download -f sha="$GITHUB_SHA"
          fi
          EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/downloads/Easybook-0.8.0.apk?ref=apk-download" --jq .sha 2>/dev/null || true)
          export EXISTING_SHA
          python3 - <<'PY'
          import os, json, base64
          body = dict(message='Publish installable APK', branch='apk-download', content=base64.b64encode(open('Easybook-0.8.0.apk','rb').read()).decode())
          if os.environ.get('EXISTING_SHA'): body['sha'] = os.environ['EXISTING_SHA']
          with open('/tmp/apk-upload.json','w') as f: json.dump(body,f)
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/downloads/Easybook-0.8.0.apk" --method PUT --input /tmp/apk-upload.json --jq .commit.sha
          python3 - <<'PYSHOTS'
          import pathlib,subprocess,json,base64,os
          repo=os.environ['GITHUB_REPOSITORY']
          for p in pathlib.Path('smoke').glob('*.png'):
              endpoint=f'repos/{repo}/contents/downloads/preview-{p.name}'
              old=subprocess.run(['gh','api',endpoint+'?ref=apk-download','--jq','.sha'],text=True,capture_output=True)
              payload=dict(message='Update Android emulator preview',branch='apk-download',content=base64.b64encode(p.read_bytes()).decode())
              if old.returncode==0:payload['sha']=old.stdout.strip()
              subprocess.run(['gh','api',endpoint,'--method','PUT','--input','-','--jq','.commit.sha'],input=json.dumps(payload),text=True,check=True)
          PYSHOTS
