name: Build Android APK
on:
  push:
    branches: [main]
    # Runtime, dependency and build-tool edits trigger an APK validation build;
    # only explicit manual dispatch can publish a Release.
    paths:
      - 'app/**'
      - 'editor/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-editor.mjs'
      - 'scripts/generate-ui.mjs'
      - 'scripts/prepare-pdf.mjs'
      - 'scripts/check-android-identity.mjs'
      - 'worker/android-identity.mjs'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'editor/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-editor.mjs'
      - 'scripts/generate-ui.mjs'
      - 'scripts/prepare-pdf.mjs'
      - 'scripts/check-android-identity.mjs'
      - 'worker/android-identity.mjs'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the validated APK as a GitHub Release'
        required: false
        type: boolean
        default: false
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  apk:
    outputs:
      version: ${{ steps.apk_version.outputs.name }}
      version_code: ${{ steps.apk_version.outputs.code }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.easybook-signing/development.keystore
          key: easybook-notes-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.easybook-signing"
          if [ ! -f "$HOME/.easybook-signing/development.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Easybook,C=SG" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused folder navigation regression
        run: node scripts/folder-navigation-test.mjs
      - name: Attachment protocol static checks
        run: node --check shared/attachments.mjs && node --check worker/attachments.mjs && node --check app/src/main/assets/pdf/reader.mjs && node --check app/src/main/assets/pdf/glass.mjs
      - name: Build editor and focused table integrity
        run: npm run build:editor && node scripts/table-integrity.mjs && node scripts/picker-static-check.mjs
      - name: Android and Web table contract consistency
        run: gradle :app:testReleaseUnitTest --tests com.feoearth.easybook.AttachmentRangeTest --tests com.feoearth.easybook.TableContractTest --tests com.feoearth.easybook.NativeMcpPairingTest --tests com.feoearth.easybook.NativeAccountErrorsTest --tests com.feoearth.easybook.AccountBridgePermissionTest --tests com.feoearth.easybook.NativeTransportTest --no-daemon
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signing
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Verify Passkey signing association
        run: node scripts/check-android-identity.mjs app/build/outputs/apk/release/app-release.apk
      - name: Read version from Android Gradle release configuration
        id: apk_version
        shell: bash
        run: |
          VERSION=$(sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid Android versionName'; exit 1; }
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          PACKAGE=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -m 1 "^package:")
          VERSION_CODE=$(printf '%s\n' "$PACKAGE" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid APK versionCode'; exit 1; }
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk 'Easybook-${{ steps.apk_version.outputs.name }}.apk'
          sha256sum 'Easybook-${{ steps.apk_version.outputs.name }}.apk' > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-${{ steps.apk_version.outputs.name }}.apk
            SHA256SUMS.txt
  release:
    needs: apk
    # A successful automatic APK build is normally only a CI artifact.
    # Exception: this explicitly approved, one-time updater rollout is published on the named merge commit.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(android): in-app updater v0.8.6') && needs.apk.outputs.version == '0.8.6')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Easybook-APK
      - name: Publish user-authorized APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ needs.apk.outputs.version }}'
          VERSION_CODE='${{ needs.apk.outputs.version_code }}'
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid Release APK versionCode'; exit 1; }
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null | sed -nE 's/^- APK versionCode: ([0-9]+)$/\1/p' | head -n 1 || true)
          if [[ "$PREVIOUS" =~ ^[0-9]+$ ]] && (( VERSION_CODE <= PREVIOUS )); then echo "versionCode must increase: $VERSION_CODE <= $PREVIOUS"; exit 1; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          NOTES=$(printf '%s\n' \
            '## 安装包' \
            '' \
            "- Android 8.0 及以上：\`Easybook-${VERSION}.apk\`" \
            '- `SHA256SUMS.txt`：安装包完整性校验值' \
            '' \
            '## 发布信息' \
            '' \
            "- 应用版本：${VERSION}" \
            "- 发布构建号：${GITHUB_RUN_NUMBER}" \
            "- APK versionCode: ${VERSION_CODE}" \
            '- 发布方式：从 `main` 手动批准发布' \
            '' \
            '## 更新内容' \
            '' \
            '以下自动列出自上一正式发行版以来的合并变更。' \
            '' \
            '## 验证说明' \
            '' \
            '已完成编译、签名和自动化检查。自动化检查不等同于 Android 通行密钥实机登录及生产备份恢复验收。')
          gh release create "$TAG" "Easybook-${VERSION}.apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easybook ${VERSION} · build ${GITHUB_RUN_NUMBER}" --notes "$NOTES" --generate-notes




