name: Build Android APK
on:
  push:
    branches: [main, easybook-native-data]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    if: github.event_name != 'pull_request' || (github.head_ref == 'fix/android-sync-policy-save' || github.head_ref == 'fix/sync-policies-active-space' || github.head_ref == 'fix/sync-policies-list-gestures' || github.head_ref == 'fix/sync-policies-list-hit-area' || github.head_ref == 'fix/sync-policies-large-attachments')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.easybook-signing/development.keystore
          key: easybook-notes-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.easybook-signing"
          if [ ! -f "$HOME/.easybook-signing/development.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Easybook,C=SG" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Attachment protocol static checks
        run: node --check shared/attachments.mjs && node --check worker/attachments.mjs
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signing
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Easybook-0.8.0.apk
          sha256sum Easybook-0.8.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-0.8.0.apk
            SHA256SUMS.txt
  release:
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Easybook-APK
      - name: Publish user-authorized APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.8.0-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Easybook-0.8.0.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easybook 0.8.0 · build ${GITHUB_RUN_NUMBER}" --notes "大附件与智能无损压缩：Android本地目标1 GB，Web按浏览器配额保存Blob；云端按压缩后文件大小硬性限制50 MB，4 MB分块传输，gzip无损压缩与SHA-256完整性校验。超限仅本地，正文和占位元数据继续同步。原文件保留，QWEA0玻璃实现不变。versionCode 51。必要完整性和静态检查已通过；未运行模拟器或UI自动化。按用户明确确认沿用现有开发签名。大附件须单独保存，旧JSON备份不会静默遗漏。"
