name: Build Android APK
on:
  push:
    branches: [main]
    # Runtime, dependency and build-tool edits trigger an APK validation build;
    # only explicit manual dispatch can publish a Release.
    paths:
      - 'app/**'
      - 'editor/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-editor.mjs'
      - 'scripts/generate-ui.mjs'
      - 'scripts/prepare-pdf.mjs'
      - 'scripts/check-android-identity.mjs'
      - 'worker/android-identity.mjs'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the validated APK as a GitHub Release'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  apk:
    outputs:
      version: ${{ steps.apk_version.outputs.name }}
    if: github.event_name != 'pull_request' || (github.head_ref == 'fix/android-passkey-website-association' || github.head_ref == 'fix/android-account-settings-ui' || github.head_ref == 'fix/android-account-handoff' || github.head_ref == 'feat/phase-two-collaboration' || github.head_ref == 'fix/android-account-phase-two' || github.head_ref == 'feat/core-workspace-release' || github.head_ref == 'feat/unified-workspace-identity' || github.head_ref == 'feat/easybook-passkeys' || github.head_ref == 'feat/easybook-accounts-oauth' || github.head_ref == 'fix/android-sync-policy-save' || github.head_ref == 'fix/sync-policies-active-space' || github.head_ref == 'fix/sync-policies-list-gestures' || github.head_ref == 'fix/sync-policies-list-hit-area' || github.head_ref == 'fix/sync-policies-large-attachments' || github.head_ref == 'fix/sync-policies-pdf-reader' || github.head_ref == 'fix/sync-policies-pdf-loading' || github.head_ref == 'fix/sync-policies-pdf-interaction' || github.head_ref == 'fix/sync-policies-tables-pickers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.easybook-signing/development.keystore
          key: easybook-notes-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.easybook-signing"
          if [ ! -f "$HOME/.easybook-signing/development.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Easybook,C=SG" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused folder navigation regression
        run: node scripts/folder-navigation-test.mjs
      - name: Attachment protocol static checks
        run: node --check shared/attachments.mjs && node --check worker/attachments.mjs && node --check app/src/main/assets/pdf/reader.mjs && node --check app/src/main/assets/pdf/glass.mjs
      - name: Build editor and focused table integrity
        run: npm run build:editor && node scripts/table-integrity.mjs && node scripts/picker-static-check.mjs
      - name: Android and Web table contract consistency
        run: gradle :app:testReleaseUnitTest --tests com.feoearth.easybook.TableContractTest --tests com.feoearth.easybook.NativeMcpPairingTest --tests com.feoearth.easybook.NativeAccountErrorsTest --tests com.feoearth.easybook.AccountBridgePermissionTest --tests com.feoearth.easybook.NativeTransportTest --no-daemon
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signing
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Verify Passkey signing association
        run: node scripts/check-android-identity.mjs app/build/outputs/apk/release/app-release.apk
      - name: Read version from Android Gradle release configuration
        id: apk_version
        shell: bash
        run: |
          VERSION=$(awk -F"'" '/versionName / {print $2; exit}' app/build.gradle)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid Android versionName'; exit 1; }
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk 'Easybook-${{ steps.apk_version.outputs.name }}.apk'
          sha256sum 'Easybook-${{ steps.apk_version.outputs.name }}.apk' > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-${{ steps.apk_version.outputs.name }}.apk
            SHA256SUMS.txt
  release:
    needs: apk
    # A successful automatic APK build is only a CI artifact.
    # Release publication requires an explicit manual dispatch from main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Easybook-APK
      - name: Publish user-authorized APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ needs.apk.outputs.version }}'
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "Easybook-${VERSION}.apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easybook ${VERSION} · build ${GITHUB_RUN_NUMBER}" --notes "用户手动批准发布的 Android APK。沿用现有签名，保留 QWEA0；编译、签名和自动化检查通过不等同于 Android 通行密钥实机登录及生产备份恢复验收。"




