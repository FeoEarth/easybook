name: Build Android APK
on:
  push:
    branches: [main]
    # Runtime, dependency and build-tool edits trigger an APK validation build;
    # only explicit manual dispatch can publish a Release.
    paths:
      - 'app/**'
      - 'editor/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-editor.mjs'
      - 'scripts/generate-ui.mjs'
      - 'scripts/prepare-pdf.mjs'
      - 'scripts/check-android-identity.mjs'
      - 'worker/android-identity.mjs'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'editor/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-editor.mjs'
      - 'scripts/generate-ui.mjs'
      - 'scripts/prepare-pdf.mjs'
      - 'scripts/check-android-identity.mjs'
      - 'worker/android-identity.mjs'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Build with the private Release key and publish only from main'
        required: false
        type: boolean
        default: false
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  apk:
    outputs:
      version: ${{ steps.apk_version.outputs.name }}
      version_code: ${{ steps.apk_version.outputs.code }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version before building
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Official Android releases must be dispatched from main'
            exit 1
          fi
          VERSION_CODE=$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid Release APK versionCode'; exit 1; }
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null | sed -nE 's/^- APK versionCode: ([0-9]+)$/\1/p' | head -n 1 || true)
          if [[ "$PREVIOUS" =~ ^[0-9]+$ ]] && (( VERSION_CODE <= PREVIOUS )); then
            echo "::error::versionCode must increase: $VERSION_CODE <= $PREVIOUS. Bump app/build.gradle before dispatch."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Native bridge bootstrap regression
        run: node scripts/native-bootstrap-test.mjs
      - name: On-device AI tool safety protocol
        run: node scripts/local-ai-protocol-test.mjs
      - name: Focused folder navigation regression
        run: node scripts/folder-navigation-test.mjs && node scripts/native-dock-focus-test.mjs
      - name: Attachment protocol static checks
        run: node --check shared/attachments.mjs && node --check worker/attachments.mjs && node --check app/src/main/assets/pdf/reader.mjs && node --check app/src/main/assets/pdf/glass.mjs
      - name: Build editor and focused table integrity
        run: npm run build:editor && node scripts/table-integrity.mjs && node scripts/picker-static-check.mjs
      - name: Android and Web table contract consistency
        run: gradle :app:testReleaseUnitTest --tests com.feoearth.easybook.AttachmentRangeTest --tests com.feoearth.easybook.TableContractTest --tests com.feoearth.easybook.NativeMcpPairingTest --tests com.feoearth.easybook.NativeAccountErrorsTest --tests com.feoearth.easybook.AccountBridgePermissionTest --tests com.feoearth.easybook.NativeTransportTest --no-daemon
      - name: Reject publishing from a non-main branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref != 'refs/heads/main'
        run: |
          echo '::error::Official Android releases must be dispatched from main'
          exit 1
      - name: Build unsigned release for CI validation
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release != true
        run: gradle :app:assembleRelease --no-daemon
      - name: Restore private Release signing key
        id: signing_key
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EASYBOOK_RELEASE_KEYSTORE_BASE64: ${{ secrets.EASYBOOK_RELEASE_KEYSTORE_BASE64 }}
          EASYBOOK_RELEASE_STORE_PASSWORD: ${{ secrets.EASYBOOK_RELEASE_STORE_PASSWORD }}
          EASYBOOK_RELEASE_KEY_ALIAS: ${{ secrets.EASYBOOK_RELEASE_KEY_ALIAS }}
          EASYBOOK_RELEASE_KEY_PASSWORD: ${{ secrets.EASYBOOK_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in EASYBOOK_RELEASE_KEYSTORE_BASE64 EASYBOOK_RELEASE_STORE_PASSWORD EASYBOOK_RELEASE_KEY_ALIAS EASYBOOK_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$EASYBOOK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easybook-release.p12"
          test -s "$RUNNER_TEMP/easybook-release.p12"
          echo "EASYBOOK_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/easybook-release.p12" >> "$GITHUB_ENV"
      - name: Build officially signed Release APK
        if: steps.signing_key.outcome == 'success'
        env:
          EASYBOOK_REQUIRE_RELEASE_SIGNING: 'true'
          EASYBOOK_RELEASE_STORE_PASSWORD: ${{ secrets.EASYBOOK_RELEASE_STORE_PASSWORD }}
          EASYBOOK_RELEASE_KEY_ALIAS: ${{ secrets.EASYBOOK_RELEASE_KEY_ALIAS }}
          EASYBOOK_RELEASE_KEY_PASSWORD: ${{ secrets.EASYBOOK_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signing
        if: steps.signing_key.outcome == 'success'
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Verify Passkey signing association
        if: steps.signing_key.outcome == 'success'
        run: node scripts/check-android-identity.mjs app/build/outputs/apk/release/app-release.apk
      - name: Verify LiteRT native runtime is absent from base APK
        run: |
          if unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep -E '^lib/[^/]+/liblitertlm_jni\.so$'; then
            echo '::error::LiteRT JNI library unexpectedly packaged in base APK'
            exit 1
          fi
      - name: Package optional LiteRT-LM ARM64 runtime
        if: steps.signing_key.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          AAR=$(find "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1/com.google.ai.edge.litertlm/litertlm-android/0.18.0" -name 'litertlm-android-0.18.0.aar' -type f -print -quit)
          test -n "$AAR"
          unzip -p "$AAR" jni/arm64-v8a/liblitertlm_jni.so > Easybook-LiteRT-LM-arm64-v8a.so
          echo '4a94a3f955ad7c58cbcdfc5cb4ff566187bb9e8c5bc2c4056b4e226646c7e8fd  Easybook-LiteRT-LM-arm64-v8a.so' | sha256sum -c -
      - name: Read version from Android Gradle release configuration
        id: apk_version
        if: steps.signing_key.outcome == 'success'
        shell: bash
        run: |
          VERSION=$(sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -n 1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid Android versionName'; exit 1; }
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          PACKAGE=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -m 1 "^package:")
          VERSION_CODE=$(printf '%s\n' "$PACKAGE" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid APK versionCode'; exit 1; }
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Prepare APK
        if: steps.signing_key.outcome == 'success'
        run: |
          cp app/build/outputs/apk/release/app-release.apk 'Easybook-${{ steps.apk_version.outputs.name }}.apk'
          sha256sum 'Easybook-${{ steps.apk_version.outputs.name }}.apk' Easybook-LiteRT-LM-arm64-v8a.so > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: steps.signing_key.outcome == 'success'
        with:
          name: Easybook-APK
          path: |
            Easybook-${{ steps.apk_version.outputs.name }}.apk
            Easybook-LiteRT-LM-arm64-v8a.so
            SHA256SUMS.txt
      - name: Remove temporary private signing key
        if: always() && steps.signing_key.outcome == 'success'
        run: rm -f "$RUNNER_TEMP/easybook-release.p12"
  release:
    needs: apk
    # No automatic release for any push. Only an explicit, trusted main dispatch
    # can access the private signing key and publish an APK.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Easybook-APK
      - name: Publish user-authorized APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ needs.apk.outputs.version }}'
          VERSION_CODE='${{ needs.apk.outputs.version_code }}'
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid Release APK versionCode'; exit 1; }
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null | sed -nE 's/^- APK versionCode: ([0-9]+)$/\1/p' | head -n 1 || true)
          if [[ "$PREVIOUS" =~ ^[0-9]+$ ]] && (( VERSION_CODE <= PREVIOUS )); then echo "versionCode must increase: $VERSION_CODE <= $PREVIOUS"; exit 1; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          NOTES=$(printf '%s\n' \
            '## 安装包' \
            '' \
            "- Android 8.0 及以上：\`Easybook-${VERSION}.apk\`" \
            '- `SHA256SUMS.txt`：安装包完整性校验值' \
            '- `Easybook-LiteRT-LM-arm64-v8a.so`：可选本地 AI 运行组件，应用内按需下载' \
            '' \
            '## 发布信息' \
            '' \
            "- 应用版本：${VERSION}" \
            "- 发布构建号：${GITHUB_RUN_NUMBER}" \
            "- APK versionCode: ${VERSION_CODE}" \
            '- 发布方式：从 `main` 手动批准发布' \
            '' \
            '## 更新内容' \
            '' \
            '以下自动列出自上一正式发行版以来的合并变更。' \
            '' \
            '## 验证说明' \
            '' \
            '已完成编译、签名和自动化检查。自动化检查不等同于 Android 通行密钥实机登录及生产备份恢复验收。')
          gh release create "$TAG" "Easybook-${VERSION}.apk" Easybook-LiteRT-LM-arm64-v8a.so SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easybook ${VERSION} · build ${GITHUB_RUN_NUMBER}" --notes "$NOTES" --generate-notes




