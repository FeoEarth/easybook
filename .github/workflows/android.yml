name: Build Android APK
on:
  push:
    branches: [main, easybook-native-data]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.easybook-signing/development.keystore
          key: easybook-notes-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.easybook-signing"
          if [ ! -f "$HOME/.easybook-signing/development.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Easybook,C=SG" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Validate web code
        run: |
          node scripts/check.mjs
          node scripts/worker-integration.mjs
      - name: Build installable APK
        run: gradle :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reuse verified candidate checks
        id: verified
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          candidates=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs" -f branch=easybook-native-data -f status=success -f per_page=5 --jq '.workflow_runs[] | select(.conclusion == "success") | .head_sha')
          for candidate in $candidates; do
            [[ "$candidate" =~ ^[a-f0-9]{40}$ ]] || continue
            git fetch --no-tags --depth=1 origin "$candidate"
            if git diff --quiet "$candidate" HEAD -- . ':!.github/workflows/android.yml'; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "Verified application, tests and assets match successful candidate $candidate; only publication workflow may differ."
              break
            fi
          done
      - name: Android emulator interaction checks
        if: steps.verified.outputs.reuse != 'true'
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 180
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-smoke.py
      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-smoke-screenshots
          path: smoke/
      - name: Verify APK signing
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Easybook-0.6.0.apk
          sha256sum Easybook-0.6.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-0.6.0.apk
            SHA256SUMS.txt
      - name: Publish APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Easybook-0.6.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "Easybook 0.5.0 · build ${GITHUB_RUN_NUMBER}" --notes "Android 8+ 可安装测试版。第二阶段原生安全重构：Keystore AES-256-GCM 凭据存储、受限 Bridge、原生配对、可验证迁移及安全检查点回滚。笔记正文与云端数据尚未端到端加密。Release 构建，沿用兼容旧版的签名。"
      - name: Keep latest APK available through repository downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/apk-download" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/apk-download -f sha="$GITHUB_SHA"
          fi
          EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/downloads/Easybook-0.6.0.apk?ref=apk-download" --jq .sha 2>/dev/null || true)
          export EXISTING_SHA
          python3 - <<'PY'
          import os, json, base64
          body = dict(message='Publish installable APK', branch='apk-download', content=base64.b64encode(open('Easybook-0.6.0.apk','rb').read()).decode())
          if os.environ.get('EXISTING_SHA'): body['sha'] = os.environ['EXISTING_SHA']
          with open('/tmp/apk-upload.json','w') as f: json.dump(body,f)
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/downloads/Easybook-0.6.0.apk" --method PUT --input /tmp/apk-upload.json --jq .commit.sha
          python3 - <<'PYSHOTS'
          import pathlib,subprocess,json,base64,os
          repo=os.environ['GITHUB_REPOSITORY']
          for p in pathlib.Path('smoke').glob('*.png'):
              endpoint=f'repos/{repo}/contents/downloads/preview-{p.name}'
              old=subprocess.run(['gh','api',endpoint+'?ref=apk-download','--jq','.sha'],text=True,capture_output=True)
              payload=dict(message='Update Android emulator preview',branch='apk-download',content=base64.b64encode(p.read_bytes()).decode())
              if old.returncode==0:payload['sha']=old.stdout.strip()
              subprocess.run(['gh','api',endpoint,'--method','PUT','--input','-','--jq','.commit.sha'],input=json.dumps(payload),text=True,check=True)
          PYSHOTS
