name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easybook-development-signing-v1
      - name: Validate web code
        run: node scripts/check.mjs
      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Easybook-0.1.0.apk
          sha256sum Easybook-0.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-0.1.0.apk
            SHA256SUMS.txt
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Easybook-0.1.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "Easybook 0.1.0 · build ${GITHUB_RUN_NUMBER}" --notes "Android 8+ 可安装测试版。Notion 风格笔记、离线编辑、Cloudflare D1 同步、设备密钥配对、冲突副本、回收站。开发签名；非应用商店正式发行版。"
