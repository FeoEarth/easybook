name: Build Android APK
on:
  push:
    branches: [main, easybook-native-data]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    if: github.event_name != 'pull_request' || (github.head_ref == 'fix/android-sync-policy-save' || github.head_ref == 'fix/sync-policies-active-space' || github.head_ref == 'fix/sync-policies-list-gestures' || github.head_ref == 'fix/sync-policies-list-hit-area' || github.head_ref == 'fix/sync-policies-large-attachments' || github.head_ref == 'fix/sync-policies-pdf-reader' || github.head_ref == 'fix/sync-policies-pdf-loading')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.easybook-signing/development.keystore
          key: easybook-notes-signing-v2
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.easybook-signing"
          if [ ! -f "$HOME/.easybook-signing/development.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Easybook,C=SG" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Attachment protocol static checks
        run: node --check shared/attachments.mjs && node --check worker/attachments.mjs && node --check app/src/main/assets/pdf/reader.mjs && node --check app/src/main/assets/pdf/glass.mjs
      - name: PDF first-page integrity (no browser or UI automation)
        run: npm run build:pdf && node scripts/pdf-reader-integrity.mjs
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signing
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Easybook-0.8.0.apk
          sha256sum Easybook-0.8.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Easybook-APK
          path: |
            Easybook-0.8.0.apk
            SHA256SUMS.txt
  release:
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Easybook-APK
      - name: Publish user-authorized APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.8.0-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Easybook-0.8.0.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easybook 0.8.0 · build ${GITHUB_RUN_NUMBER}" --notes "修复Android PDF初始化作用域错误导致加载卡住及标题缺失。统一异步文件读取、PDF.js加载与错误反馈，支持重试和返回，保留新版悬浮阅读界面与QWEA0玻璃。versionCode 53。PDF.js真实首页栅格、文件名、关闭重开完整性检查和Android编译签名检查；未运行模拟器、UI自动化或Android真机验证。本次不部署Cloudflare。"
