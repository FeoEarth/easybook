name: Selection and move UI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    if: github.head_ref == 'ui-selection-move'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --check worker/ui.mjs && node --check scripts/selection-move-ui-test.cjs
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node scripts/selection-move-ui-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Move-visual-review
          path: move-review/
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:compileReleaseJavaWithJavac --no-daemon
