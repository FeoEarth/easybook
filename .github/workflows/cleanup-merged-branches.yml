name: Review and clean merged branches
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only, or delete every verified merged branch'
        type: choice
        required: true
        default: preview
        options: [preview, delete]
      confirmation:
        description: 'For deletion, type DELETE-MERGED exactly'
        type: string
        required: false
        default: ''
concurrency:
  group: easybook-merged-branch-cleanup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Discover, verify, and optionally delete merged branches
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'This workflow only runs from main'; exit 1; }
          [[ "$MODE" == 'preview' || "$MODE" == 'delete' ]] || { echo 'Invalid mode'; exit 1; }
          if [[ "$MODE" == 'delete' && "$CONFIRM" != 'DELETE-MERGED' ]]; then
            echo 'Deletion requires the exact confirmation DELETE-MERGED'
            exit 1
          fi

          default_branch=$(gh api "repos/$repo" --jq '.default_branch')
          [[ "$default_branch" == 'main' ]] || { echo 'Default branch is not main; refusing'; exit 1; }
          main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo 'main changed before cleanup started'; exit 1; }

          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'cleanup-merged-branches.yml' -print)
          mapfile -t branches < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | sort -u)
          echo '| Branch | Decision |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          eligible=0
          deleted=0
          kept=0
          errors=0

          for branch in "${branches[@]}"; do
            reason=''
            [[ "$branch" != "$default_branch" ]] || reason='default branch'
            ref_sha=''
            if [[ -z "$reason" ]]; then
              if ! ref_sha=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null); then reason='cannot inspect branch tip'; fi
            fi
            if [[ -z "$reason" ]]; then
              if ! protected=$(gh api "repos/$repo/branches/$branch" --jq '.protected' 2>/dev/null); then reason='cannot inspect branch protection';
              elif [[ "$protected" != 'false' ]]; then reason='protected branch'; fi
            fi
            if [[ -z "$reason" && ${#workflows[@]} -gt 0 ]] && grep -F -q -- "$branch" "${workflows[@]}"; then
              reason='referenced by an active workflow'
            fi
            if [[ -z "$reason" ]]; then
              open_prs=$(gh api -X GET "repos/$repo/pulls" -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$branch" --jq 'length')
              [[ "$open_prs" == '0' ]] || reason='open pull request exists'
            fi
            if [[ -z "$reason" ]]; then
              ahead=$(gh api "repos/$repo/compare/$default_branch...$branch" --jq '.ahead_by' 2>/dev/null || echo unavailable)
              merged_prs=$(gh api -X GET "repos/$repo/pulls" -f state=closed -f "head=${GITHUB_REPOSITORY_OWNER}:$branch" -f per_page=100 --jq '[.[] | select(.merged_at != null)] | length')
              if [[ "$ahead" != '0' && "$merged_prs" == '0' ]]; then reason="unmerged commits: $ahead"; fi
            fi
            if [[ -n "$reason" ]]; then
              echo "KEEP $branch: $reason"
              echo "| \`$branch\` | KEEP: $reason |" >> "$GITHUB_STEP_SUMMARY"
              kept=$((kept + 1))
              continue
            fi

            eligible=$((eligible + 1))
            if [[ "$MODE" == 'preview' ]]; then
              echo "WOULD DELETE $branch"
              echo "| \`$branch\` | Would delete (merged) |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            current_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            current_tip=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)
            latest_open_prs=$(gh api -X GET "repos/$repo/pulls" -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$branch" --jq 'length')
            if [[ "$current_main" != "$main_sha" || -z "$current_tip" || "$current_tip" != "$ref_sha" || "$latest_open_prs" != '0' ]]; then
              echo "KEEP $branch: repository changed during cleanup"
              echo "| \`$branch\` | KEEP: repository changed during cleanup |" >> "$GITHUB_STEP_SUMMARY"
              kept=$((kept + 1))
            elif gh api -X DELETE "repos/$repo/git/refs/heads/$branch" --silent; then
              echo "DELETED $branch"
              echo "| \`$branch\` | Deleted |" >> "$GITHUB_STEP_SUMMARY"
              deleted=$((deleted + 1))
            else
              echo "DELETE FAILED $branch"
              echo "| \`$branch\` | Delete failed |" >> "$GITHUB_STEP_SUMMARY"
              errors=$((errors + 1))
            fi
          done

          echo "Mode=$MODE, eligible=$eligible, deleted=$deleted, kept=$kept, errors=$errors"
          [[ "$errors" -eq 0 ]]
