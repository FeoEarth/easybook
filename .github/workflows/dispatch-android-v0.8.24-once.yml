name: One-time Easybook 0.8.24 release dispatch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-android-v0.8.24-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "github.event.head_commit.message == 'chore(release): dispatch Android 0.8.24'"
    runs-on: ubuntu-latest
    steps:
      - name: Request signed Android release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/dispatches" -f ref=main -f 'inputs[publish_release]=true'
