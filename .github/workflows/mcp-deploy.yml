name: Deploy isolated MCP OAuth Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Configure repository secret CLOUDFLARE_API_TOKEN before deployment."
            exit 1
          fi
      - name: Install OAuth Worker dependencies
        working-directory: mcp-oauth
        run: npm install --no-audit --no-fund
      - name: Deploy isolated Worker
        working-directory: mcp-oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cd0656b978e10adaab62bfab81914c6b
        run: npx wrangler deploy
