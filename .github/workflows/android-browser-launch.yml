name: Android Agent browser launch
on:
  pull_request:
    branches: [main]
    paths:
      - 'agent-browser/**'
      - 'android-shared/java/**/AgentBrowserProtocol.java'
      - 'app/src/main/java/**/AgentBrowser*.java'
      - 'app/src/main/java/**/MainActivity.java'
      - 'app/src/androidTest/java/**/BrowserLaunchChecks.java'
      - 'app/src/androidTest/java/**/PhaseTwoInstrumentation.java'
      - '.github/workflows/android-browser-launch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-37.2 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: npm ci --no-audit --no-fund
      - name: Build the apps and instrumentation with the same test signer
        run: |
          export EASYBOOK_DEBUG_STORE="$RUNNER_TEMP/easybook-browser-smoke.keystore"
          keytool -genkeypair -keystore "$EASYBOOK_DEBUG_STORE" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Easybook browser smoke' -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx2g
          gradle :agent-browser:assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx2g
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install agent-browser/build/outputs/apk/debug/agent-browser-x86_64-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e browserLaunch true com.feoearth.easybook.notes.test/com.feoearth.easybook.PhaseTwoInstrumentation | tee "$RUNNER_TEMP/browser-launch.txt"
            adb logcat -b crash -d -t 120
            adb logcat -d -s EasybookBrowser ActivityTaskManager GeckoRuntime GeckoSession
            grep -q 'passed=true' "$RUNNER_TEMP/browser-launch.txt"
