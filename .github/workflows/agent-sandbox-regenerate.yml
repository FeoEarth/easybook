name: Regenerate Agent sandbox UI assets (temporary branch maintenance)
on:
  push:
    branches: [feat/android-agent-sandbox-20261122]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/editor.js app/src/main/assets/editor.js.LEGAL.txt worker/editor.mjs worker/ui.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(agent): refresh deterministic editor bundles"
            git push origin HEAD:feat/android-agent-sandbox-20261122
          fi
