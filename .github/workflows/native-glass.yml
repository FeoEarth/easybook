name: Native glass prototype only
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'prototype-native-liquid-glass'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # API26 compiled in run 40106283287, but its bundled WebView is too old.
        # Do not repeatedly boot that blocked image; retain its original evidence.
        api: [35]
    steps:
      - uses: actions/checkout@v4
      - name: Free space for one emulator, no repeated boot attempts
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ephemeral test-only signature
        run: |
          mkdir -p "$HOME/.easybook-signing"
          keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Native Glass Prototype Test" -keyalg RSA -keysize 2048 -validity 30
      - name: Compile prototype and targeted instrumentation only
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PnativeGlassPrototype -PnativeGlassProbe --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: false
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell am instrument -w com.feoearth.easybook.notes.test/com.feoearth.easybook.NativeGlassInstrumentation | tee /tmp/native-glass-check.txt
            mkdir -p native-glass-evidence
            adb pull /sdcard/Android/data/com.feoearth.easybook.notes/files/native-glass-evidence native-glass-evidence/ || true
            adb logcat -d -s AndroidRuntime chromium NativeGlassProbe > native-glass-evidence/logcat.txt
            grep -Eq 'passed=true|environment_blocked=true' /tmp/native-glass-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-glass-api${{ matrix.api }}
          path: native-glass-evidence/
          if-no-files-found: ignore
  video-player:
    if: github.head_ref == 'release/android-photos-pixel'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Free emulator space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build:editor
      - name: Ephemeral instrumentation signing only
        run: |
          mkdir -p "$HOME/.easybook-signing"
          keytool -genkeypair -keystore "$HOME/.easybook-signing/development.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Player UI Probe' -keyalg RSA -keysize 2048 -validity 30
      - name: Build real app and video instrumentation
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PnativeGlassPrototype -PvideoPlayerProbe --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: false
          script: |
            adb shell wm size 1206x2622
            adb shell wm density 480
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.feoearth.easybook.notes.test/com.feoearth.easybook.VideoPlayerInstrumentation | tee /tmp/video-player-check.txt
            mkdir -p video-player-evidence
            adb pull /sdcard/Android/data/com.feoearth.easybook.notes/files/video-player-evidence video-player-evidence/ || true
            adb logcat -d -s AndroidRuntime chromium NativeGlassProbe > video-player-evidence/logcat.txt
            for report in video-player-evidence/*/result.json; do if test -f "$report"; then cat "$report"; fi; done
            grep -q 'passed=true' /tmp/video-player-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-photos-pixel-api35
          path: video-player-evidence/
          if-no-files-found: ignore

  previous-player-evidence:
    if: github.head_ref == 'release/android-photos-pixel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40667284871
          name: android-photos-pixel-api35
          path: previous-player-evidence
      - name: Inspect previous failed Android report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('previous-player-evidence').rglob('result.json'):
              print('ANDROID_REPORT_BEGIN')
              print(path.read_text())
              print('ANDROID_REPORT_END')
          PY
      - name: Preview previous Android captures for inspection
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,io
          for path in Path('previous-player-evidence').rglob('*.png'):
              image=Image.open(path).convert('RGB')
              image.thumbnail((1000,1000))
              out=io.BytesIO()
              image.save(out,format='JPEG',quality=87)
              print('ANDROID_SCREENSHOT:'+path.name+':'+base64.b64encode(out.getvalue()).decode())
          PY
