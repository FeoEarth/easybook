name: Deploy membership checkout
on:
  workflow_dispatch:
    inputs:
      scanner_only:
        description: Deploy only the membership payment scanner
        type: boolean
        default: false
      apply_schema:
        description: Apply schema when the workflow token has D1 write access
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: easybook-production-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix mcp-oauth --no-audit --no-fund
      - name: Build web assets
        if: ${{ !inputs.scanner_only }}
        run: npm run build:editor
      - name: Apply additive membership schema
        if: inputs.apply_schema && !inputs.scanner_only
        run: |
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0023-membership.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0024-membership-scan-windows.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0025-membership-job-lease.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0026-membership-account-wallets.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0027-membership-payment-method.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0028-membership-duration-only.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0029-membership-collections.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0030-membership-coupons.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0031-coupon-deletion.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0032-membership-billing.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0033-membership-gift-cards.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0034-subscription-gift-cards.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0035-admin-gifts-and-balance-types.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0036-gift-code-formats.sql --yes
          npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file worker/migrations/0037-gift-purchase-checkout.sql --yes
          npx --no-install wrangler d1 execute easybook-iodash-auth --config admin-worker/wrangler.jsonc --remote --file admin-worker/migrations/0001-iodash-auth.sql --yes
      - name: Count existing checkout and receipt anomalies
        if: inputs.scanner_only
        continue-on-error: true
        run: npx --no-install wrangler d1 execute easybook-data --config worker/wrangler.jsonc --remote --file scripts/membership-production-audit.sql --json
      - name: Deploy isolated collection worker with transitional trigger
        if: ${{ !inputs.scanner_only }}
        run: |
          node -e 'const fs=require("fs"),c=JSON.parse(fs.readFileSync("collection-worker/wrangler.jsonc"));c.triggers.crons=["*/2 * * * *"];fs.writeFileSync("collection-worker/wrangler-transition.json",JSON.stringify(c))'
          npx --no-install wrangler deploy --config collection-worker/wrangler-transition.json --keep-vars
      - name: Deploy membership scanner
        run: npx --no-install wrangler deploy --config payment-worker/wrangler.jsonc --keep-vars
      - name: Remove superseded collection trigger
        if: ${{ !inputs.scanner_only }}
        run: npx --no-install wrangler deploy --config collection-worker/wrangler.jsonc --keep-vars
      - name: Deploy independent Iodash admin
        if: ${{ !inputs.scanner_only }}
        run: npx --no-install wrangler deploy --config admin-worker/wrangler.jsonc --keep-vars
  application-release:
    needs: deploy
    if: ${{ !inputs.scanner_only && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets: inherit
