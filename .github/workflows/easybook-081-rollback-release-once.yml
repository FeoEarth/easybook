name: Easybook 0.8.1 rollback release (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/easybook-081-rollback-release-once.yml'
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: github.event.head_commit.message == 'release: publish verified predictive-back rollback build 370'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: '71cbb00e555fef28a64913dcefc5a3ff3c3d3a3d'
      BUILD_RUN: '40522306730'
      TAG: 'v0.8.1-build370'
    steps:
      - name: Require successful pinned Android build
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN")
          test "$(jq -r '.head_sha' <<< "$metadata")" = "$SOURCE_SHA"
          test "$(jq -r '.head_branch' <<< "$metadata")" = main
          test "$(jq -r '.conclusion' <<< "$metadata")" = success
      - name: Download and verify build 370
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name Easybook-APK --dir .
          test -s Easybook-0.8.1.apk
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish rollback APK
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Rollback release already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" Easybook-0.8.1.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Easybook 0.8.1 · build 370 (Predictive Back rollback)' --notes '紧急回退版本：撤销 Android Predictive Back，恢复原返回逻辑。Android versionCode 59，可从问题版本 versionCode 58 正常升级。构建、签名与自动化检查通过；未声称完成实机验收。'
      - name: Flag defective build 369
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.8.1-build369 --repo "$GITHUB_REPOSITORY" --prerelease --notes '⚠️ 已知问题：Android Predictive Back 导航故障。请不要安装此版本。请改用 v0.8.1-build370（已回退跟手返回）。此旧版本保留用于追溯。'
