name: Liquid Glass scoped UI
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/assets/index.html'
      - 'worker/ui.mjs'
      - 'scripts/check.mjs'
      - 'scripts/build-worker.mjs'
      - 'scripts/glass-ui-smoke.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/glass-ui.yml'
concurrency:
  group: glass-ui-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check.mjs && node scripts/build-worker.mjs
      - name: Shared UI generated output matches Android source
        run: node -e "const fs=require('fs');import('./worker/ui.mjs').then(m=>{if(m.default!==fs.readFileSync('app/src/main/assets/index.html','utf8'))process.exit(1)})"
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node scripts/glass-ui-smoke.cjs
