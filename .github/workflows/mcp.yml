name: MCP focused checks
on:
  pull_request:
    paths:
      - 'worker/mcp.mjs'
      - 'worker/index.mjs'
      - 'scripts/mcp-test.mjs'
      - '.github/workflows/mcp.yml'
  push:
    branches: [main]
    paths:
      - 'worker/mcp.mjs'
      - 'worker/index.mjs'
      - 'scripts/mcp-test.mjs'
jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/mcp.mjs && node --check worker/index.mjs && node scripts/mcp-test.mjs
