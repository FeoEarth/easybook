name: MCP focused checks
on:
  pull_request:
    paths:
      - 'worker/mcp*.mjs'
      - 'worker/index.mjs'
      - 'worker/workspace-*.mjs'
      - 'worker/oauth-*.mjs'
      - 'worker/account-*.mjs'
      - 'worker/attachment*.mjs'
      - 'worker/identity-*.mjs'
      - 'scripts/workspace-identity-test.mjs'
      - 'scripts/workspace-oauth-security-test.mjs'
      - 'scripts/atomic-note-batch-test.mjs'
      - 'scripts/permanent-operations-test.mjs'
      - 'scripts/account-history-test.mjs'
      - 'scripts/security-restore-test.mjs'
      - 'scripts/account-deletion-test.mjs'
      - 'worker/security-migrations/**'
      - 'scripts/mcp*.mjs'
      - 'scripts/mcp-github-identity-test.mjs'
      - 'worker/mcp-github-identity.mjs'
      - '.github/workflows/mcp.yml'
      - 'mcp-oauth/**'
      - 'shared/**'
      - 'worker/migrations/**'
      - 'worker/schema.sql'
  push:
    branches: [main]
    paths:
      - 'worker/mcp*.mjs'
      - 'worker/index.mjs'
      - 'worker/workspace-*.mjs'
      - 'worker/oauth-*.mjs'
      - 'worker/account-*.mjs'
      - 'worker/attachment*.mjs'
      - 'worker/identity-*.mjs'
      - 'scripts/workspace-identity-test.mjs'
      - 'scripts/workspace-oauth-security-test.mjs'
      - 'scripts/atomic-note-batch-test.mjs'
      - 'scripts/permanent-operations-test.mjs'
      - 'scripts/account-history-test.mjs'
      - 'scripts/security-restore-test.mjs'
      - 'scripts/account-deletion-test.mjs'
      - 'worker/security-migrations/**'
      - 'scripts/mcp*.mjs'
      - 'mcp-oauth/**'
      - 'shared/**'
      - 'worker/migrations/**'
      - 'worker/schema.sql'
jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node --check worker/mcp.mjs && node --check worker/index.mjs && node scripts/mcp-test.mjs && node scripts/mcp-upload-test.mjs && node scripts/mcp-github-identity-test.mjs && node scripts/mcp-pairing-release-test.mjs
      - name: Bundle OAuth Worker (no deploy)
        run: cd mcp-oauth && npm ci --no-audit --no-fund && npx wrangler deploy --dry-run --outdir ../mcp-oauth-bundle
      - name: Account and OAuth security regression
        run: node scripts/web-store-test.mjs && node scripts/attachment-test.mjs && node mcp-oauth/test/native-passkeys-security.mjs && node scripts/native-account-security-test.mjs && node scripts/atomic-note-batch-test.mjs && node scripts/permanent-operations-test.mjs && node scripts/account-history-test.mjs && node scripts/security-restore-test.mjs && node scripts/account-deletion-test.mjs && node scripts/workspace-oauth-security-test.mjs && node scripts/workspace-identity-test.mjs && node scripts/account-oauth-security-test.mjs && node mcp-oauth/test/passkeys-security.mjs
      - name: Verify Passkeys with a real browser virtual authenticator
        run: |
          npx --no-install playwright install chromium
          EASYBOOK_PASSKEY_BROWSER=1 node mcp-oauth/test/passkeys-security.mjs
      - name: Save Passkey browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-passkey-ui
          path: account-ui-passkey-*.png
          if-no-files-found: ignore
      - name: Save OAuth Worker deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: easybook-mcp-oauth-bundle
          path: mcp-oauth-bundle/
          if-no-files-found: error
          retention-days: 7



