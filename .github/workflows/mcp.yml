name: MCP focused checks
on:
  pull_request:
    paths:
      - 'worker/mcp*.mjs'
      - 'worker/index.mjs'
      - 'scripts/mcp*.mjs'
      - 'scripts/mcp-github-identity-test.mjs'
      - 'worker/mcp-github-identity.mjs'
      - '.github/workflows/mcp.yml'
      - 'mcp-oauth/**'
      - 'shared/**'
      - 'worker/migrations/**'
      - 'worker/schema.sql'
  push:
    branches: [main]
    paths:
      - 'worker/mcp*.mjs'
      - 'worker/index.mjs'
      - 'scripts/mcp*.mjs'
      - 'mcp-oauth/**'
      - 'shared/**'
      - 'worker/migrations/**'
      - 'worker/schema.sql'
jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check worker/mcp.mjs && node --check worker/index.mjs && node scripts/mcp-test.mjs && node scripts/mcp-github-identity-test.mjs && node scripts/mcp-pairing-release-test.mjs
      - name: Bundle OAuth Worker (no deploy)
        run: cd mcp-oauth && npm install --no-audit --no-fund && npx wrangler deploy --dry-run --outdir ../mcp-oauth-bundle
      - name: Save OAuth Worker deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: easybook-mcp-oauth-bundle
          path: mcp-oauth-bundle/
          if-no-files-found: error
          retention-days: 7

