name: Deploy MCP pairing Workers
on:
  push:
    branches: [main]
    paths:
      - 'mcp-oauth/**'
      - 'worker/**'
      - '.github/workflows/deploy-mcp-pairing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: easybook-mcp-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in repository secrets"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in repository secrets"; exit 1; }
      - name: Install editor dependencies and build assets
        run: npm ci && npm run build:editor
      - name: Deploy sync Worker (preserve existing bindings and secrets)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.105.0 deploy --keep-vars
      - name: Install OAuth Worker dependencies
        working-directory: mcp-oauth
        run: npm install --no-audit --no-fund
      - name: Deploy OAuth Worker after sync Worker
        working-directory: mcp-oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
