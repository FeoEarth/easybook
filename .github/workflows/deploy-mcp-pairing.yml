name: Deploy MCP OAuth Worker
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow == 'Deploy MCP OAuth Worker' && 'easybook-production-worker' || format('easybook-oauth-child-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: mcp-oauth
      - name: Install shared client dependencies for upload compatibility check
        run: npm ci --no-audit --no-fund
      - name: Verify pinned Passkey browser bundle
        run: node mcp-oauth/scripts/build-passkey-client.mjs && git diff --exit-code -- mcp-oauth/src/passkey-browser.mjs
      - name: Validate OAuth bundle
        run: mcp-oauth/node_modules/.bin/wrangler deploy --config mcp-oauth/wrangler.jsonc --dry-run --outdir oauth-preflight
      - name: Validate MCP protocol before candidate upload
        run: |
          node scripts/account-oauth-security-test.mjs
          node mcp-oauth/test/passkeys-security.mjs
          node mcp-oauth/test/qr-login-security.mjs
          node scripts/mcp-capabilities-test.mjs
          node scripts/mcp-upload-test.mjs
          node scripts/mcp-pairing-release-test.mjs
          node scripts/ai-byok-test.mjs
          node scripts/ai-execution-boundary-test.mjs
          node scripts/mcp-oauth-runtime-test.mjs
          # Migration is applied via authorized Cloudflare; candidate smoke verifies runtime D1 readiness.
      - name: Upload OAuth candidate only
        id: candidate
        run: |
          export PATH="$PWD/mcp-oauth/node_modules/.bin:$PATH"
          node scripts/cloudflare-release.mjs stage --oauth
      - name: Verify OAuth candidate
        run: node scripts/oauth-release-smoke.mjs '${{ steps.candidate.outputs.url }}' && node scripts/native-transport-release-probe.mjs '${{ steps.candidate.outputs.url }}'
      - name: Promote OAuth candidate only
        if: github.ref == 'refs/heads/main'
        run: node scripts/cloudflare-release.mjs promote --oauth
      - name: Verify OAuth production
        if: github.ref == 'refs/heads/main'
        run: node scripts/oauth-release-smoke.mjs '${{ steps.candidate.outputs.production_url }}' && node scripts/native-transport-release-probe.mjs '${{ steps.candidate.outputs.production_url }}'
      - name: Roll back failed OAuth promotion
        if: ${{ (failure() || cancelled()) && github.ref == 'refs/heads/main' }}
        run: node scripts/cloudflare-release.mjs rollback --oauth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-release-${{ github.run_id }}
          path: |
            release-state.json
            account-ui-*.png
          if-no-files-found: ignore
          retention-days: 14




