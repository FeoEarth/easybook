name: Deploy MCP OAuth Worker
on:
  workflow_dispatch:
  push:
    branches: [fix/production-runtime]
    paths:
      - 'mcp-oauth/**'
      - 'worker/mcp.mjs'
      - 'worker/mcp-github-identity.mjs'
      - 'scripts/cloudflare-release.mjs'
      - 'scripts/oauth-release-smoke.mjs'
      - '.github/workflows/deploy-mcp-pairing.yml'
permissions:
  contents: read
concurrency:
  group: easybook-mcp-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: mcp-oauth
      - name: Validate OAuth bundle
        run: mcp-oauth/node_modules/.bin/wrangler deploy --config mcp-oauth/wrangler.jsonc --dry-run --outdir oauth-preflight
      - name: Upload OAuth candidate only
        id: candidate
        run: |
          export PATH="$PWD/mcp-oauth/node_modules/.bin:$PATH"
          node scripts/cloudflare-release.mjs stage --oauth
      - name: Verify OAuth candidate
        run: node scripts/oauth-release-smoke.mjs '${{ steps.candidate.outputs.url }}'
      - name: Promote OAuth candidate only
        if: github.ref == 'refs/heads/main'
        run: node scripts/cloudflare-release.mjs promote --oauth
      - name: Verify OAuth production
        if: github.ref == 'refs/heads/main'
        run: node scripts/oauth-release-smoke.mjs https://easybook-mcp-oauth.1902521952.workers.dev
      - name: Roll back failed OAuth promotion
        if: ${{ (failure() || cancelled()) && github.ref == 'refs/heads/main' }}
        run: node scripts/cloudflare-release.mjs rollback --oauth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-release-${{ github.run_id }}
          path: release-state.json
          if-no-files-found: ignore
          retention-days: 14
