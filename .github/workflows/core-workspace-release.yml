name: Core workspace release checks
on:
  push:
    branches: [feat/core-workspace-release]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix mcp-oauth --no-audit --no-fund
      - name: Focused account, migration, isolation, OAuth and restore checks
        run: |
          node scripts/core-workspace-release-test.mjs
          node scripts/workspace-identity-test.mjs
          node scripts/web-store-test.mjs
          node scripts/workspace-oauth-security-test.mjs
          node scripts/native-account-security-test.mjs
          node scripts/native-account-ui-test.mjs
          node mcp-oauth/test/native-passkeys-security.mjs
          node scripts/permanent-operations-test.mjs
          node scripts/account-deletion-test.mjs
          node scripts/account-history-test.mjs
          node scripts/native-management-test.mjs
          node scripts/workspace-delete-test.mjs
          node scripts/stage-two-audit-test.mjs
          node scripts/security-restore-test.mjs
          node scripts/mcp-upload-test.mjs
          node scripts/check-web-runtime.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/core-workspace-browser-test.mjs && node scripts/collaboration-browser-test.mjs && node scripts/account-settings-browser-test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-settings-ui
          path: account-settings-*.png
          if-no-files-found: ignore
