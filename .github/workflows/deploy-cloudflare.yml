name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

concurrency:
  group: easybook-production-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare PDF assets
        run: node scripts/prepare-pdf.mjs
      - name: Install current Wrangler
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4
      - name: Validate Worker bundle without deployment
        working-directory: worker
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir ../.wrangler-preflight
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.jsonc
      - name: Verify production web and API
        run: |
          set -euo pipefail
          for origin in https://easybook-sync.1902521952.workers.dev https://easybook.loonxy.com; do
            curl --fail --show-error --retry 3 --retry-delay 3 "$origin/health" | grep -q '"ok":true'
            curl --fail --show-error --retry 3 --retry-delay 3 "$origin/" -o /tmp/easybook-home.html
            grep -qi '<html' /tmp/easybook-home.html
            grep -qi 'Easybook' /tmp/easybook-home.html
          done
