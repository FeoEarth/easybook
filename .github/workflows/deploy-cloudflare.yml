name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'editor/**'
      - 'shared/**'
      - 'app/src/main/assets/**'
      # Dependency or npm build-script changes can alter the production bundle.
      # General test-only scripts and documentation should not deploy.
      - 'package.json'
      - 'package-lock.json'
      # Keep the release/bundle generation tools in the allowlist.
      - 'scripts/cloudflare-release.mjs'
      - 'scripts/custom-domain-release-check.mjs'
      - 'scripts/rollback-probe.mjs'
      - 'scripts/web-release-smoke.mjs'
      - 'scripts/live-core-workspace-probe.mjs'
      - 'scripts/live-pairing-probe.mjs'
      - 'scripts/live-mcp-upload-probe.mjs'
      - 'scripts/build-editor.mjs'
      - 'scripts/generate-ui.mjs'
      - 'scripts/prepare-pdf.mjs'
      - 'scripts/folder-navigation-test.mjs'
      - 'scripts/check-web-runtime.mjs'
      - 'scripts/mcp-pairing-release-test.mjs'
      - 'scripts/mcp-capabilities-test.mjs'
      - 'scripts/mcp-upload-test.mjs'
      - '.github/workflows/deploy-cloudflare.yml'
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'easybook-production-worker' || format('easybook-validation-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Build and verify exact committed Web artifacts
        run: |
          node scripts/prepare-pdf.mjs
          node scripts/build-editor.mjs
          node scripts/generate-ui.mjs
          git diff --exit-code -- app/src/main/assets/editor.js worker/ui.mjs worker/editor.mjs worker/pdf-static.mjs
          node scripts/folder-navigation-test.mjs
          node scripts/check-web-runtime.mjs
          node scripts/mcp-pairing-release-test.mjs
          node scripts/mcp-capabilities-test.mjs
          node scripts/mcp-upload-test.mjs
      - name: Install pinned Wrangler
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4.152.0
      - name: Validate bundle without deployment
        run: npx --no-install wrangler deploy --config worker/wrangler.jsonc --dry-run --outdir .wrangler-preflight
      - name: Install browser for release smoke test
        run: npx --no-install playwright install chromium
      - name: Verify decoded video frames and player controls
        run: node scripts/video-player-smoke.mjs
      # Schema migration is applied via the authorized Cloudflare connection.
      # Candidate readiness below verifies D1 through its runtime binding before promotion.
      - name: Record custom-domain baseline without weakening zone security
        run: node scripts/custom-domain-release-check.mjs record
      - name: Verify real rollback on binding-free probe Worker
        run: node scripts/rollback-probe.mjs
      - name: Record baseline and upload candidate without production traffic
        id: candidate
        run: node scripts/cloudflare-release.mjs stage
      - name: Verify candidate in real Chromium
        run: |
          node scripts/web-release-smoke.mjs '${{ steps.candidate.outputs.url }}'
          if [ '${{ steps.candidate.outputs.identity_v2 }}' != 'true' ]; then node scripts/mcp-ui-smoke.cjs '${{ steps.candidate.outputs.url }}'; fi
      - name: Verify live pairing with synthetic workspace only
        if: steps.candidate.outputs.identity_v2 != 'true'
        run: node scripts/live-pairing-probe.mjs '${{ steps.candidate.outputs.url }}'
      - name: Verify real MCP uploads with synthetic workspace and temporary probe
        if: steps.candidate.outputs.identity_v2 != 'true'
        run: node scripts/live-mcp-upload-probe.mjs '${{ steps.candidate.outputs.url }}'
      - name: Verify active workspace protocol with synthetic data
        if: steps.candidate.outputs.identity_v2 == 'true'
        run: node scripts/live-core-workspace-probe.mjs '${{ steps.candidate.outputs.url }}'
      - name: Promote verified candidate
        if: github.ref == 'refs/heads/main'
        run: node scripts/cloudflare-release.mjs promote
      - name: Verify production browser and API
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/web-release-smoke.mjs https://easybook-sync.1902521952.workers.dev
          if [ '${{ steps.candidate.outputs.identity_v2 }}' = 'true' ]; then node scripts/live-core-workspace-probe.mjs https://easybook-sync.1902521952.workers.dev; else node scripts/live-pairing-probe.mjs https://easybook-sync.1902521952.workers.dev; fi
          node scripts/custom-domain-release-check.mjs verify
      - name: Roll back failed or cancelled promotion
        if: ${{ (failure() || cancelled()) && github.ref == 'refs/heads/main' }}
        run: node scripts/cloudflare-release.mjs rollback
      - name: Save release evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-release-${{ github.run_id }}
          path: |
            release-state.json
            rollback-probe-state.json
            custom-domain-baseline.json
            web-release-smoke.png
            mcp-ui-*.png
            mcp-upload-live-evidence.json
          if-no-files-found: ignore
          retention-days: 14





