name: One-time synthetic browser pairing validation
on:
  push:
    branches: [fix/production-runtime]
    paths: ['.github/workflows/pairing-release-check.yml', 'scripts/browser-pairing-smoke.mjs']
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install chromium
      - name: Record custom-domain edge response without user data
        run: node -e "fetch('https://easybook.loonxy.com/').then(async r=>console.log({status:r.status,mitigated:r.headers.get('cf-mitigated'),title:(await r.text()).match(/<title>(.*?)<\\/title>/i)?.[1]}))"
      - run: node scripts/browser-pairing-smoke.mjs
        env:
          TEST_SOURCE_HTML: 'true'
          OAUTH_CANDIDATE_ORIGIN: https://1149ffed-easybook-mcp-oauth.1902521952.workers.dev
          SYNTHETIC_PAIRING_CHALLENGE: dOBTKuyLGM66visN5m5PZuJySrceuOhc_-fsnOGnj4c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-pairing
          path: browser-pairing-success.png
          if-no-files-found: ignore
