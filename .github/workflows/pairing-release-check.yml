name: One-time synthetic browser pairing validation
on:
  push:
    branches: [fix/production-runtime]
    paths: ['.github/workflows/pairing-release-check.yml', 'scripts/browser-pairing-smoke.mjs']
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install chromium
      - run: node scripts/browser-pairing-smoke.mjs
        env:
          SYNTHETIC_PAIRING_CHALLENGE: MkQGpt3SPUpfNKgaVPkg9Dk9Hb9vqKqRGuwh3lUcFMA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-pairing
          path: browser-pairing-success.png
          if-no-files-found: ignore
