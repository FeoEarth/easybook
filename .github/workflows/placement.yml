name: Placement native compilation
on:
  pull_request:
    branches: [main]
    paths: ['app/src/main/java/**', 'app/build.gradle']
permissions:
  contents: read
jobs:
  compile:
    if: github.head_ref == 'management-placement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:compileReleaseJavaWithJavac --no-daemon
