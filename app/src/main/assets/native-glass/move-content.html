<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"><style id="originalStyles"></style><style>
html:root,body{background:transparent!important;min-height:0!important;overflow:hidden!important;margin:0!important}
#moveDialog{position:fixed!important;right:auto!important;bottom:auto!important;margin:0!important;opacity:1!important;transform:none!important;transition:none!important;animation:none!important;background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;border-color:transparent!important;visibility:visible!important;box-sizing:border-box!important}
</style></head><body><svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" id="symbols"></svg><dialog id="moveDialog" class="ui-material" open></dialog><script>
(()=>{
 const panel=document.getElementById('moveDialog'),send=event=>FormatActions.postMessage(JSON.stringify(event));let signature='',gesture=null,pending=null,suppress=false,scrollUntil=0,scrollQueued=false;
 window.renderFormat=(content,geometry)=>{
  if(gesture&&content){pending=[content,geometry];content=null}
  if(content){const next=JSON.stringify(content);if(next!==signature){
   document.getElementById('originalStyles').textContent=content.css;document.documentElement.dataset.theme=content.theme;document.documentElement.style.cssText=content.rootStyle;document.body.className=content.bodyClass;document.getElementById('symbols').innerHTML=content.symbols;panel.innerHTML=content.html;
   for(const element of panel.querySelectorAll('*')){
    if(['SCRIPT','IFRAME','OBJECT','EMBED','LINK','META','FORM','INPUT','TEXTAREA'].includes(element.tagName.toUpperCase())){element.remove();continue}
    for(const attr of [...element.attributes])if(/^on/i.test(attr.name)||/^(src|href|xlink:href)$/i.test(attr.name)&&!attr.value.startsWith('#'))element.removeAttribute(attr.name);
   }
   signature=next;scrollUntil=0;
  }}
  panel.style.left=geometry.left+'px';panel.style.top=geometry.top+'px';panel.style.width=geometry.width+'px';panel.style.height=geometry.height+'px';panel.style.maxHeight=geometry.height+'px';
  if(pending)pending[1]=geometry;
  const scroll=document.getElementById('moveScroll');if(scroll&&!gesture&&performance.now()>=scrollUntil&&Math.abs(scroll.scrollTop-geometry.scrollTop)>1)scroll.scrollTop=geometry.scrollTop;
  if(content)send({type:'ready',revision:geometry.revision});
 };
 panel.addEventListener('mousedown',event=>event.preventDefault());
 panel.addEventListener('pointerdown',event=>{const drag=!!event.target.closest('#moveDragZone')&&!event.target.closest('button');gesture={x:event.clientX,y:event.clientY,pointer:event.pointerId,drag,moved:false};suppress=false;if(drag){panel.setPointerCapture(event.pointerId);send({type:'drag',phase:'down',y:event.clientY,pointer:event.pointerId})}},{passive:true});
 panel.addEventListener('pointermove',event=>{if(!gesture||gesture.pointer!==event.pointerId)return;if(Math.abs(event.clientX-gesture.x)>8||Math.abs(event.clientY-gesture.y)>8)gesture.moved=true;if(gesture.drag)send({type:'drag',phase:'move',y:event.clientY,pointer:event.pointerId})},{passive:true});
 const release=event=>{if(!gesture||gesture.pointer!==event.pointerId)return;const current=gesture;gesture=null;suppress=current.moved||event.type==='pointercancel';if(current.drag)send({type:'drag',phase:event.type==='pointercancel'?'cancel':'up',y:event.clientY,pointer:event.pointerId});requestAnimationFrame(()=>{if(pending){const args=pending;pending=null;window.renderFormat(...args)}})};
 window.addEventListener('pointerup',release,true);window.addEventListener('pointercancel',release,true);
 panel.addEventListener('click',event=>{const target=event.target.closest('[data-format-token]');if(!target)return;event.preventDefault();event.stopImmediatePropagation();if(!suppress&&!target.disabled)send({type:'click',token:target.dataset.formatToken});suppress=false},true);
 panel.addEventListener('scroll',event=>{if(event.target.id!=='moveScroll')return;scrollUntil=performance.now()+250;if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{scrollQueued=false;send({type:'scroll',top:document.getElementById('moveScroll')?.scrollTop||0})})},true);
})();
</script></body></html>
