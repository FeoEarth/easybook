<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"><style id="originalStyles"></style><style>
html:root,body{background:transparent!important;min-height:0!important;overflow:hidden!important;margin:0!important}
#navigation .glass{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important;border-color:transparent!important;opacity:1!important}
</style></head><body><svg id="symbols" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></svg><div id="dockHost"></div><script>
(()=>{
 const host=document.getElementById('dockHost');let signature='',down=null;
 window.renderFormat=(content,geometry)=>{
  if(content){const next=JSON.stringify(content);if(next!==signature){
   document.getElementById('originalStyles').textContent=content.css;document.documentElement.dataset.theme=content.theme;document.documentElement.style.cssText=content.rootStyle;document.body.className=content.bodyClass;document.body.dataset.page=content.panel;
   document.getElementById('symbols').innerHTML=content.symbols;host.innerHTML=content.html;
   for(const element of host.querySelectorAll('*')){
    if(['SCRIPT','IFRAME','OBJECT','EMBED','LINK','META','FORM','TEXTAREA'].includes(element.tagName.toUpperCase())){element.remove();continue}
    for(const attr of [...element.attributes])if(/^on/i.test(attr.name)||/^(src|href|xlink:href)$/i.test(attr.name)&&!attr.value.startsWith('#'))element.removeAttribute(attr.name);
   }
   const input=document.getElementById('search');if(input){input.readOnly=true;input.tabIndex=-1}signature=next;
  }FormatActions.postMessage(JSON.stringify({type:'ready',revision:geometry.revision}));}
 };
 host.addEventListener('mousedown',e=>e.preventDefault());
 host.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}},{passive:true});
 host.addEventListener('click',e=>{
  e.preventDefault();e.stopImmediatePropagation();const moved=down&&(Math.abs(e.clientX-down.x)>8||Math.abs(e.clientY-down.y)>8);down=null;if(moved)return;
  const button=e.target.closest('[data-format-token]');if(button&&!button.disabled)FormatActions.postMessage(JSON.stringify({type:'click',token:button.dataset.formatToken}));
  else if(e.target.closest('.searchbar'))FormatActions.postMessage(JSON.stringify({type:'focus'}));
 },true);
})();
</script></body></html>
