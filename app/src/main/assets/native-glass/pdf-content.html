<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"><style id="originalStyles"></style><style>html,body{margin:0!important;background:transparent!important;overflow:hidden!important}button{background:transparent}*{box-sizing:border-box}</style></head><body><div id="pdfHost"></div><script>
(()=>{const host=document.getElementById('pdfHost');let signature='',down=null,blockedUntil=0;window.renderFormat=(content,g)=>{if(content){const next=JSON.stringify(content);if(signature!==next){document.getElementById('originalStyles').textContent=content.css;document.documentElement.style.cssText=content.rootStyle;document.documentElement.dataset.theme=content.theme;host.innerHTML=content.html;for(const el of host.querySelectorAll('*')){if(['SCRIPT','IFRAME','OBJECT','EMBED','LINK','META','FORM','TEXTAREA','INPUT'].includes(el.tagName)){el.remove();continue}for(const a of [...el.attributes])if(/^on/i.test(a.name)||['href','xlink:href'].includes(a.name)&&!a.value.startsWith('#')||a.name==='src'&&!/^data:image\/(png|jpeg|webp);base64,/.test(a.value))el.removeAttribute(a.name)}signature=next}FormatActions.postMessage(JSON.stringify({type:'ready',revision:g.revision}))}const el=host.querySelector('[data-pdf-glass]');if(el)for(const [k,v]of Object.entries({position:'fixed',left:g.left+'px',top:g.top+'px',right:'auto',bottom:'auto',width:g.width+'px',height:g.height+'px',margin:'0'}))el.style.setProperty(k,v,'important')};host.addEventListener('mousedown',e=>e.preventDefault());host.addEventListener('pointerdown',e=>{if(!e.isPrimary){down=null;blockedUntil=performance.now()+500;return}down={x:e.clientX,y:e.clientY}},{passive:true});host.addEventListener('pointercancel',()=>{down=null;blockedUntil=performance.now()+300});host.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8){down=null;blockedUntil=performance.now()+300}},{passive:true});host.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(!down||performance.now()<blockedUntil)return;if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8){down=null;return}down=null;const b=e.target.closest('[data-format-token]');if(b&&!b.disabled)FormatActions.postMessage(JSON.stringify({type:'click',token:b.dataset.formatToken}))},true)})();
</script></body></html>
