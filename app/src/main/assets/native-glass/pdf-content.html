<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"><style id="originalStyles"></style><style>html,body{margin:0!important;background:transparent!important;overflow:hidden!important}button{background:transparent}*{box-sizing:border-box}</style></head><body><div id="pdfHost"></div><script>
(()=>{const host=document.getElementById('pdfHost');let signature='',down=null,blockedUntil=0,composing=false,pending=null;
const post=event=>FormatActions.postMessage(JSON.stringify(event));
window.renderFormat=(content,g)=>{if(composing){pending=[content,g];return}if(content){const next=JSON.stringify(content);if(signature!==next){const focused=host.contains(document.activeElement)&&document.activeElement.matches('input')?document.activeElement:null,token=focused?.dataset.formatToken,start=focused?.selectionStart,end=focused?.selectionEnd,value=focused?.value;document.getElementById('originalStyles').textContent=content.css;document.documentElement.style.cssText=content.rootStyle;document.documentElement.dataset.theme=content.theme;host.innerHTML=content.html;
for(const el of host.querySelectorAll('*')){if(['SCRIPT','IFRAME','OBJECT','EMBED','LINK','META','TEXTAREA'].includes(el.tagName)||el.tagName==='INPUT'&&!['text','search'].includes(el.type)){el.remove();continue}for(const a of [...el.attributes])if(/^on/i.test(a.name)||['action','formaction','href','xlink:href'].includes(a.name)&&!a.value.startsWith('#')||a.name==='src'&&!/^data:image\/(png|jpeg|webp);base64,/.test(a.value))el.removeAttribute(a.name)}signature=next;
const input=token?[...host.querySelectorAll('input')].find(el=>el.dataset.formatToken===token):host.querySelector('input[data-pdf-focus="true"]');if(input){if(token)input.value=value;input.focus({preventScroll:true});if(start!=null)try{input.setSelectionRange(start,end)}catch{}if(!token){if(input.dataset.pdfSelect==='true')input.select();post({type:'focus'})}}}
post({type:'ready',revision:g.revision})}const el=host.querySelector('[data-pdf-glass]');if(el)for(const [k,v]of Object.entries({position:'fixed',left:g.left+'px',top:g.top+'px',right:'auto',bottom:'auto',width:g.width+'px',height:g.height+'px',margin:'0'}))el.style.setProperty(k,v,'important')};
function edit(input,submit=false){if(input?.matches('input'))post({type:'edit',token:input.dataset.formatToken,value:input.value.slice(0,256),submit})}
host.addEventListener('compositionstart',()=>{composing=true});host.addEventListener('compositionend',e=>{composing=false;if(pending){const update=pending;pending=null;window.renderFormat(...update)}edit(e.target)});host.addEventListener('input',e=>{if(!composing)edit(e.target)});host.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();edit(e.target,true)}});host.addEventListener('submit',e=>{e.preventDefault();edit(e.target.querySelector('input'),true)});
host.addEventListener('mousedown',e=>{if(!e.target.closest('input'))e.preventDefault()});host.addEventListener('pointerdown',e=>{if(!e.isPrimary){down=null;blockedUntil=performance.now()+500;return}down={x:e.clientX,y:e.clientY}},{passive:true});host.addEventListener('pointercancel',()=>{down=null;blockedUntil=performance.now()+300});host.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8){down=null;blockedUntil=performance.now()+300}},{passive:true});host.addEventListener('click',e=>{if(e.target.closest('input'))return;e.preventDefault();e.stopPropagation();if(!down||performance.now()<blockedUntil)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>8){down=null;return}down=null;const b=e.target.closest('button[data-format-token]');if(b?.dataset.pdf==='clearquery'){const input=host.querySelector('input');if(input)input.value=''}if(b&&!b.disabled)post({type:'click',token:b.dataset.formatToken})},true)})();
</script></body></html>
