plugins { id 'com.android.application' }
android {
    namespace 'com.feoearth.easybook'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.feoearth.easybook.notes'; minSdk 26; targetSdk 35; versionCode 43; versionName '0.8.0'; testInstrumentationRunner (project.hasProperty('nativeGlassProbe') ? 'com.feoearth.easybook.NativeGlassInstrumentation' : 'com.feoearth.easybook.PhaseTwoInstrumentation') }
    signingConfigs {
        debug {
            storeFile file(System.getenv('EASYBOOK_DEBUG_STORE') ?: "${System.properties['user.home']}/.easybook-signing/development.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { buildConfigField 'boolean', 'NATIVE_GLASS_PROTOTYPE', project.hasProperty('nativeGlassPrototype') ? 'true' : 'false' }
        release { buildConfigField 'boolean', 'NATIVE_GLASS_PROTOTYPE', 'true'; minifyEnabled false; debuggable false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }





// npm ci is already part of the release pipeline; never fetch viewer assets at runtime.
tasks.register('preparePdfAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/prepare-pdf.mjs'
}
tasks.named('preBuild').configure { dependsOn 'preparePdfAssets' }
