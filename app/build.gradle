plugins { id 'com.android.application' }
android {
    namespace 'com.feoearth.easybook'
    compileSdk 35
    defaultConfig { applicationId 'com.feoearth.easybook.notes'; minSdk 26; targetSdk 35; versionCode 22; versionName '0.8.0'; testInstrumentationRunner 'com.feoearth.easybook.PhaseTwoInstrumentation' }
    signingConfigs {
        debug {
            storeFile file(System.getenv('EASYBOOK_DEBUG_STORE') ?: "${System.properties['user.home']}/.easybook-signing/development.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }



