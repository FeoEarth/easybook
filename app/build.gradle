plugins { id 'com.android.application' }

apply from: rootProject.file('gradle/android-signing.gradle')

android {
    namespace 'com.feoearth.easybook'
    compileSdk 35
    buildToolsVersion '37.0.0'
    buildFeatures { buildConfig true }
    defaultConfig { buildConfigField 'String', 'SOURCE_SHA', '"' + (System.getenv('GITHUB_SHA') ?: 'local') + '"' }
    defaultConfig { applicationId 'com.feoearth.easybook.notes'; minSdk 26; targetSdk 35; versionCode 121; versionName '0.8.53'; testInstrumentationRunner 'com.feoearth.easybook.PhaseTwoInstrumentation' }
    // The LiteRT-LM Java API stays in classes.dex; its native runtime is a verified,
    // optional Release asset installed only on explicit user request.
    defaultConfig {
        def runNumber = System.getenv('GITHUB_RUN_NUMBER')
        buildConfigField 'String', 'LOCAL_AI_RUNTIME_TAG', '"' + (runNumber ? ('v' + versionName + '-build' + runNumber) : '') + '"'
    }
    packaging { jniLibs { excludes += ['**/liblitertlm_jni.so'] } }
    sourceSets.main.java.srcDir(rootProject.file('android-shared/java'))
    buildTypes {
        debug { buildConfigField 'boolean', 'NATIVE_GLASS_PROTOTYPE', project.hasProperty('nativeGlassPrototype') ? 'true' : 'false' }
        release {
            buildConfigField 'boolean', 'NATIVE_GLASS_PROTOTYPE', 'true'
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant -> variant.enableUnitTest = true }
}

dependencies { implementation 'androidx.credentials:credentials:1.5.0'; implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'; implementation 'androidx.webkit:webkit:1.12.1'; implementation 'com.journeyapps:zxing-android-embedded:4.3.0'; implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }





// npm ci is already part of the release pipeline; never fetch viewer assets at runtime.
tasks.register('preparePdfAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/prepare-pdf.mjs'
}
tasks.named('preBuild').configure { dependsOn 'preparePdfAssets' }

tasks.register('prepareAgentVmAssets', Copy) {
    from("${rootProject.projectDir}/tools/agent-vm") { include '*.sh' }
    into("${project.projectDir}/src/main/assets/agent-vm")
}
tasks.named('preBuild').configure { dependsOn 'prepareAgentVmAssets' }
